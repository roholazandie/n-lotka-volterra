<!DOCTYPE html>
<html>
<head>
    <title>Oscillation Test</title>
</head>
<body>
    <h1>Testing Oscillation Implementation</h1>
    <div id="test-output"></div>
    
    <script>
        // Test the oscillation helper functions
        
        // Test makeSkewSymmetric function
        function makeSkewSymmetric(A) {
          const n = A.length;
          for (let i = 0; i < n; i++) {
            A[i][i] = 0;
            for (let j = i + 1; j < n; j++) {
              const v = 0.5 * (A[i][j] - A[j][i]);  // skew part
              A[i][j] = v;
              A[j][i] = -v;
            }
          }
          return A;
        }

        function setOscillationEquilibrium(A, xStar = null) {
          const n = A.length;
          // choose a positive equilibrium
          if (!xStar) xStar = Array.from({length: n}, () => Math.random() * 0.6 + 0.4); // (0.4,1.0)
          // epsilon = -A x*
          const eps = Array(n).fill(0);
          for (let i = 0; i < n; i++) {
            let s = 0;
            for (let j = 0; j < n; j++) s += A[i][j] * xStar[j];
            eps[i] = -s;
          }
          return {xStar, eps};
        }

        // Test with a 3x3 matrix
        const A = [
            [0, 0.5, -0.3],
            [-0.2, 0, 0.4],
            [0.1, -0.6, 0]
        ];
        
        console.log("Original matrix A:");
        console.log(A);
        
        // Make it skew-symmetric
        makeSkewSymmetric(A);
        console.log("After makeSkewSymmetric:");
        console.log(A);
        
        // Verify skew-symmetry: A^T = -A
        let isSkew = true;
        for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 3; j++) {
                if (Math.abs(A[i][j] + A[j][i]) > 1e-10) {
                    isSkew = false;
                    break;
                }
            }
        }
        console.log("Is skew-symmetric:", isSkew);
        
        // Test equilibrium calculation
        const {xStar, eps} = setOscillationEquilibrium(A);
        console.log("Equilibrium x*:", xStar);
        console.log("Linear terms ε:", eps);
        
        // Verify equilibrium: ε + A*x* should be ≈ 0
        const residual = [];
        for (let i = 0; i < 3; i++) {
            let sum = eps[i];
            for (let j = 0; j < 3; j++) {
                sum += A[i][j] * xStar[j];
            }
            residual.push(sum);
        }
        console.log("Equilibrium residual (should be ≈ 0):", residual);
        
        // Display results
        document.getElementById('test-output').innerHTML = `
            <h2>Test Results:</h2>
            <p><strong>Matrix is skew-symmetric:</strong> ${isSkew}</p>
            <p><strong>Equilibrium x*:</strong> [${xStar.map(x => x.toFixed(3)).join(', ')}]</p>
            <p><strong>Linear terms ε:</strong> [${eps.map(e => e.toFixed(3)).join(', ')}]</p>
            <p><strong>Equilibrium residual:</strong> [${residual.map(r => r.toExponential(2)).join(', ')}]</p>
            <p><strong>Max residual:</strong> ${Math.max(...residual.map(Math.abs)).toExponential(2)}</p>
        `;
    </script>
</body>
</html>
